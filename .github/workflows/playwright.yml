
name: PawCoach Playwright CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawcoach-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # 1. Download public Playwright tests
      - name: Checkout Playwright tests
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 2. Download private React application
      - name: Checkout PawCoach React
        uses: actions/checkout@v4
        with:
          repository: Haldirka/PawCoach-React
          token: ${{ secrets.PAWCOACH_REPO_TOKEN }}
          path: pawcoach-app
          persist-credentials: false

      # 3. Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 4. Configure Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pawcoach-app/frontend/package-lock.json

      # 5. Install backend dependencies
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pawcoach-app/requirements.txt

      # 6. Install Playwright and Allure dependencies
      - name: Install Playwright dependencies
        run: |
          python -m pip install pytest pytest-playwright python-dotenv allure-pytest
          python -m playwright install --with-deps chromium

      # 7. Build React frontend
      - name: Build React frontend
        working-directory: pawcoach-app/frontend
        run: |
          npm ci
          npm run build

      # 8. Start FastAPI
      - name: Start PawCoach React
        working-directory: pawcoach-app
        run: |
          python run.py > "$RUNNER_TEMP/pawcoach-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pawcoach-server.pid"

      # 9. Wait until the application is ready
      - name: Wait for PawCoach API
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent \
              http://127.0.0.1:8000/api/health; then
              echo
              echo "PawCoach API is ready."
              exit 0
            fi

            echo "Waiting for PawCoach ($attempt/60)..."
            sleep 2
          done

          echo "PawCoach failed to start."
          cat "$RUNNER_TEMP/pawcoach-server.log"
          exit 1

      # 10. Create a dedicated CI test account
      - name: Create CI test account
        env:
          PAWCOACH_EMAIL: ${{ secrets.TEST_EMAIL }}
          PAWCOACH_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          email = os.environ["PAWCOACH_EMAIL"]
          password = os.environ["PAWCOACH_PASSWORD"]

          if not email or not password:
              raise RuntimeError("CI test credentials are missing")

          payload = json.dumps({
              "email": email,
              "password": password,
              "confirm_password": password,
              "language": "en"
          }).encode("utf-8")

          request = urllib.request.Request(
              "http://127.0.0.1:8000/api/auth/register",
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(
              request,
              timeout=15
          ) as response:
              assert response.status == 201
              print("CI test account created successfully.")
          PY

      # 11. Run Playwright tests and collect Allure results
      - name: Run Playwright tests
        env:
          PAWCOACH_EMAIL: ${{ secrets.TEST_EMAIL }}
          PAWCOACH_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          python -m pytest tests/ -v \
            --browser chromium \
            --base-url http://127.0.0.1:8000 \
            --junitxml=pytest-report.xml \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --alluredir=allure-results \
            --clean-alluredir

      # 12. Install Allure CLI
      - name: Install Allure CLI
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          npm install --global allure-commandline@2

      # 13. Generate Allure HTML report
      - name: Generate Allure report
        if: always()
        run: |
          if [ -d "allure-results" ] && \
             [ -n "$(ls -A allure-results)" ]; then
            allure generate allure-results \
              --clean \
              --output allure-report
          else
            echo "No Allure results available."
          fi

      # 14. Upload Allure HTML report
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 14

      # 15. Upload raw Allure results
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-raw-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7

      # 16. Upload Playwright test results
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            pytest-report.xml
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      # 17. Upload backend logs if something fails
      - name: Upload PawCoach server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pawcoach-server-logs
          path: ${{ runner.temp }}/pawcoach-server.log
          if-no-files-found: ignore
          retention-days: 7
