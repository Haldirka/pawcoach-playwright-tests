
name: PawCoach Playwright CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawcoach-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # 1. Download public Playwright tests
      - name: Checkout Playwright tests
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 2. Download private React application
      - name: Checkout PawCoach React
        uses: actions/checkout@v4
        with:
          repository: Haldirka/PawCoach-React
          token: ${{ secrets.PAWCOACH_REPO_TOKEN }}
          path: pawcoach-app
          persist-credentials: false

      # 3. Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 4. Configure Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pawcoach-app/frontend/package-lock.json

      # 5. Install backend dependencies
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pawcoach-app/requirements.txt

      # 6. Install Playwright and Allure dependencies
      - name: Install Playwright dependencies
        run: |
          python -m pip install pytest pytest-playwright python-dotenv allure-pytest
          python -m playwright install --with-deps chromium

      # 7. Build React frontend
      - name: Build React frontend
        working-directory: pawcoach-app/frontend
        run: |
          npm ci
          npm run build

      # 8. Start FastAPI
      - name: Start PawCoach React
        working-directory: pawcoach-app
        run: |
          python run.py > "$RUNNER_TEMP/pawcoach-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pawcoach-server.pid"

      # 9. Wait until the application is ready
      - name: Wait for PawCoach API
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent \
              http://127.0.0.1:8000/api/health; then
              echo
              echo "PawCoach API is ready."
              exit 0
            fi

            echo "Waiting for PawCoach ($attempt/60)..."
            sleep 2
          done

          echo "PawCoach failed to start."
          cat "$RUNNER_TEMP/pawcoach-server.log"
          exit 1

      # 10. Create a dedicated CI test account
      - name: Create CI test account
        env:
          PAWCOACH_EMAIL: ${{ secrets.TEST_EMAIL }}
          PAWCOACH_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          email = os.environ["PAWCOACH_EMAIL"]
          password = os.environ["PAWCOACH_PASSWORD"]

          if not email or not password:
              raise RuntimeError("CI test credentials are missing")

          payload = json.dumps({
              "email": email,
              "password": password,
              "confirm_password": password,
              "language": "en"
          }).encode("utf-8")

          request = urllib.request.Request(
              "http://127.0.0.1:8000/api/auth/register",
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(
              request,
              timeout=15
          ) as response:
              assert response.status == 201
              print("CI test account created successfully.")
          PY

      # 11. Run Playwright tests and collect Allure results
      - name: Run Playwright tests
        env:
          PAWCOACH_EMAIL: ${{ secrets.TEST_EMAIL }}
          PAWCOACH_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          python -m pytest tests/ -v \
            --browser chromium \
            --base-url http://127.0.0.1:8000 \
            --junitxml=pytest-report.xml \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --alluredir=allure-results \
            --clean-alluredir

      # Generate a summary directly on the GitHub Actions page
      - name: Publish test summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("pytest-report.xml")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          def safe(text):
              return str(text).replace("|", "\\|").replace("\n", " ")

          with summary.open("a", encoding="utf-8") as output:
              output.write("# PawCoach Playwright Test Results\n\n")

              if not report.exists():
                  output.write(
                      "No JUnit test results were generated. "
                      "Check the workflow logs.\n"
                  )
              else:
                  root = ET.parse(report).getroot()
                  cases = root.findall(".//testcase")

                  passed = 0
                  failed = 0
                  skipped = 0
                  details = []

                  for case in cases:
                      name = case.get("name", "Unknown")
                      duration = float(case.get("time", "0"))

                      failure = case.find("failure")
                      error = case.find("error")
                      skip = case.find("skipped")

                      if failure is not None or error is not None:
                          status = "❌ Failed"
                          failed += 1
                      elif skip is not None:
                          status = "⏭️ Skipped"
                          skipped += 1
                      else:
                          status = "✅ Passed"
                          passed += 1

                      details.append((name, status, duration))

                  total = len(cases)

                  output.write("## Overview\n\n")
                  output.write("| Metric | Count |\n")
                  output.write("|---|---:|\n")
                  output.write(f"| Total | {total} |\n")
                  output.write(f"| Passed | {passed} |\n")
                  output.write(f"| Failed | {failed} |\n")
                  output.write(f"| Skipped | {skipped} |\n\n")

                  output.write("## Individual Tests\n\n")
                  output.write("| Test | Status | Duration |\n")
                  output.write("|---|---|---:|\n")

                  for name, status, duration in details:
                      output.write(
                          f"| {safe(name)} | {status} | "
                          f"{duration:.2f}s |\n"
                      )

                  output.write("\n")

                  if failed:
                      output.write(
                          "### ❌ Some tests failed\n"
                          "Review the logs and Allure artifacts.\n"
                      )
                  elif total == 0:
                      output.write(
                          "### ⚠️ No tests were collected\n"
                      )
                  else:
                      output.write(
                          "### ✅ All executed tests passed\n"
                      )
                  
                  # Show detailed failure reasons in GitHub Actions Summary
                  if failed:
                      output.write("\n## Failure Details\n\n")
                  
                      for case in cases:
                          failure = case.find("failure")
                          error = case.find("error")
                          problem = failure if failure is not None else error
                  
                          if problem is None:
                              continue
                  
                          name = case.get("name", "Unknown")
                          message = problem.get("message", "No error message")
                          traceback = problem.text or message
                  
                          # Escape Markdown code fences inside traceback
                          traceback = traceback.replace("```", "'''")
                  
                          output.write(
                              f"<details>\n"
                              f"<summary>❌ {safe(name)}</summary>\n\n"
                              f"**Error:** {safe(message)}\n\n"
                              f"```text\n{traceback[:12000]}\n```\n\n"
                              f"</details>\n\n"
                          )

                  
                  output.write(
                      "\nThe full Allure HTML report is available "
                      "under the workflow's Artifacts section.\n"
                  )
          PY


      # 12. Install Allure CLI
      - name: Install Allure CLI
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          npm install --global allure-commandline@2

      # 13. Generate Allure HTML report
      - name: Generate Allure report
        if: always()
        run: |
          if [ -d "allure-results" ] && \
             [ -n "$(ls -A allure-results)" ]; then
            allure generate allure-results \
              --clean \
              --output allure-report
          else
            echo "No Allure results available."
          fi

      # 14. Upload Allure HTML report
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 14

      # 15. Upload raw Allure results
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-raw-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7

      # 16. Upload Playwright test results
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            pytest-report.xml
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      # 17. Upload backend logs if something fails
      - name: Upload PawCoach server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pawcoach-server-logs
          path: ${{ runner.temp }}/pawcoach-server.log
          if-no-files-found: ignore
          retention-days: 7
